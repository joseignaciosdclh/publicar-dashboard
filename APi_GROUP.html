<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>N/D — Dashboard de Análisis Fundamental</title>
<style>
:root{--ink:#0B1420;--panel:#101C2C;--p2:#0D1726;--line:#223349;--iv:#E9E4D8;--dim:#8FA0B3;--gold:#CC9F53;--serif:Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--ink);color:var(--iv);font-family:var(--sans);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}.co{font-family:var(--serif);font-size:42px;line-height:1.1;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--dim);margin-top:3px}
#fresh{flex:1 1 100%;order:5;display:flex;justify-content:center;align-items:center;gap:14px;font-size:26px;font-weight:600;padding:10px 24px;border:2px solid;border-radius:50px;text-align:center;line-height:1.25}#fresh i{width:20px;height:20px;border-radius:50%;flex-shrink:0}
#next{flex:1 1 100%;order:6;display:flex;justify-content:center;align-items:center;gap:10px;font-size:16px;font-weight:600;padding:7px 18px;border:1px solid;border-radius:40px;text-align:center;line-height:1.3}#next i{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}.btn{font-size:11.5px;padding:8px 13px;background:var(--gold);color:var(--ink);border:1px solid var(--gold);cursor:pointer;white-space:nowrap}.btn.g{background:none;color:var(--iv);border-color:var(--line)}
.strip{padding:8px 22px;font-size:11.3px;color:var(--dim);border-bottom:1px solid var(--line);background:var(--p2)}
.body{display:flex}.nav{width:clamp(220px,15vw,280px);border-right:1px solid var(--line);flex-shrink:0}.ni{padding:13px 22px 13px 20px;border-left:2px solid transparent;color:var(--dim);cursor:pointer;font-size:15px;line-height:1.3;border-bottom:1px solid var(--line)}.ni.on{border-left-color:var(--gold);background:var(--panel);color:var(--iv)}
.main{flex:1;padding:20px 22px;max-width:1080px;min-width:0}h2{font-family:var(--serif);font-weight:400;font-size:23px;color:var(--gold);margin:0 0 12px}
@media(max-width:760px){.body{flex-direction:column}.nav{width:100%;display:flex;overflow-x:auto;border-right:0}.ni{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.ni.on{border-bottom-color:var(--gold)}.g2{grid-template-columns:1fr!important}.sr{flex-direction:column;gap:2px}.sr b{flex:none!important}.act{margin-left:0}}
.pn{border:1px solid var(--line);background:var(--panel);padding:15px 17px;margin-bottom:13px;overflow-x:auto}.pn h3{font-family:var(--serif);font-weight:400;font-size:15.5px;margin:0 0 10px}.pn h3 i{font-family:var(--sans);font-style:normal;font-size:11px;color:var(--dim);margin-left:8px}
.pn p{font-size:13px;line-height:1.6;color:var(--dim);margin:0}.kr{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:13px}.kpi{border:1px solid var(--line);padding:12px 14px;flex:1 1 150px;background:var(--p2)}.kpi .l{font-size:11px;color:var(--dim)}.kpi .v{font-family:var(--serif);font-size:20px;margin-top:5px}.kpi .s{font-size:11px;color:var(--dim);margin-top:4px}
.sr{display:flex;gap:12px;padding:8px 12px;margin-bottom:6px;background:var(--p2);font-size:12.5px;line-height:1.55;color:var(--dim)}.sr b{flex:0 0 190px;font-weight:400;color:var(--iv)}
.bn{border:1px solid #E3B341;background:var(--panel);padding:13px 16px;margin-bottom:13px}.bn h3{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:15px}.bn p{margin:0;font-size:12.6px;line-height:1.6;color:var(--dim)}.lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:11px;color:var(--dim)}.lg i{display:inline-block;width:10px;height:10px;margin-right:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.sb{margin-bottom:8px}.sb .t{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}.tr{height:5px;background:var(--line)}.fl{height:5px;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:6px 8px;color:var(--dim);font-weight:400;font-size:11px;border-bottom:1px solid var(--line)}td{padding:7px 8px;color:var(--dim);border-bottom:1px solid var(--line);vertical-align:top}.tag{font-size:10.5px;padding:2px 7px;border-radius:9px;border:1px solid;white-space:nowrap}
.tot{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid var(--line)}.tot .n{font-family:var(--serif);color:var(--gold);line-height:1}.tot.t24 .n{font-size:24px}.tot.t26 .n{font-size:26px}.tot .d{font-size:12px;color:var(--dim)}
.nt{margin:18px 0 6px;padding-top:14px;border-top:1px dashed var(--gold)}.nt-h{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--gold);letter-spacing:.04em;margin-bottom:8px}.nt-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 28px;margin:0}.nt-i{padding:6px 0;border-bottom:1px dotted var(--line)}.nt-i dt{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--iv)}.nt-i dd{margin:2px 0 0;font-size:11.5px;line-height:1.5;color:var(--dim)}.nt-n dt{color:#7FB7C4}.nt-n dt em{font-family:var(--sans);font-style:normal;font-size:9px;text-transform:uppercase;letter-spacing:.08em;border:1px solid #7FB7C4;border-radius:8px;padding:1px 6px;margin-left:8px}
.rside{width:clamp(340px,24vw,460px);flex-shrink:0;border-left:1px solid var(--line);align-self:flex-start;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.idl{padding:18px 22px 26px}.idl summary{cursor:pointer;font-family:var(--serif);font-size:19px;color:var(--gold);list-style:none}.idl summary::-webkit-details-marker{display:none}.idl summary small{display:block;font-family:var(--sans);font-size:13px;color:var(--dim);margin-top:5px;line-height:1.45}
.idi{margin-top:17px;cursor:pointer}.idi .t{display:flex;gap:9px;align-items:flex-start;font-size:15px;line-height:1.35;color:var(--iv)}.idi .ic{flex:0 0 18px;font-weight:700;font-size:17px;line-height:1.2}.idi .br{display:flex;gap:10px;align-items:center;margin:7px 0 0 27px}.idi .b{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}.idi .b i{display:block;height:12px}.idi .p{font-size:14px;font-weight:600;color:var(--iv);min-width:46px;text-align:right}.idi .cv{font-size:12px;color:var(--dim);margin:4px 0 0 27px}.idi:hover .tx{text-decoration:underline dotted}
@media(max-width:1279px){.body{flex-wrap:wrap}.rside{width:100%;border-left:0;border-top:1px solid var(--line);position:static;max-height:none}#idl-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:0 34px}}
@media(max-width:760px){.idl{padding:14px 16px 20px}}
.brand{display:flex;align-items:center;gap:20px;min-width:0}.logo{display:block;height:58px;max-width:200px;object-fit:contain;background:#fff;padding:7px 12px;border-radius:7px;flex-shrink:0}.logo[hidden]{display:none}@media(max-width:760px){.logo{height:46px;max-width:140px}}

<script>
/* =====================================================================================
   PLANTILLA v1.6 — Dashboard de análisis fundamental (compatible con instrucciones v5.8)
   USO: copia este archivo y SUSTITUYE SOLO LOS DATOS de las secciones marcadas «DATOS».
        NO reescribas los renderizadores (secciones marcadas «MOTOR») ni elimines secciones.
        Si un dato no existe, déjalo en "N/D": no borres el bloque ni la fila.
   BLOQUES de D.S[n] (cada sección es una lista de bloques; el orden es el de pantalla):
     {k:"aviso",p:"texto"}                                  recuadro amarillo
     {k:"kpis",a:[[etiqueta,valor,subtexto,nivel],...]}     tarjetas KPI (nivel: 2,1,0,-1,-2)
     {k:"panel",t,i,f:[[etiqueta,texto,nivel],...]}         filas con semáforo (nivel: 2,1,0,-1,-2,"y")
     {k:"texto",t,i,p}                                      párrafo
     {k:"tabla",t,i,h:[cabeceras],r:[[celdas],...]}         tabla
     {k:"flags",verde:"texto",rojo:"texto"}                 green flags / red flags
     {k:"barras",t,i,c:["risk",...]}                        barras desde D.sc (0-100)
     {k:"calc12"|"calc13"|"calc14"|"fqs"}                   se calculan solos desde D.calc, D.sc y PRICE
     {k:"checklist"}                                        S1-b: se calcula solo desde D.chk (ver abajo)
     {k:"completitud"|"bitacora"|"agotados"|"criticos"|"registro"}   S17: se generan solos desde REG/D
   D.chk (checklist del Excel): {escala:5,bloques:[{n:"Bloque",peso:20}],items:[{b:"Bloque",i:"Ítem",t:"Eliminatoria|Fundamental|Normal",
             e:"puntuado|N/D|No aplica|Informativo",n:nota numérica o null,d:"dato y fuente"}]}. El motor calcula puntos obtenidos,
             cobertura, % por valorar y nota ponderada; Informativo y No aplica no puntúan ni cuentan como pendientes.
   NOTAS:    GL = notas generales de cada sección; GLN = conceptos PARTICULARES DEL NEGOCIO que aparezcan en la presentación
             (términos, métricas, productos o prácticas propias). Añade los que surjan; el motor los marca «del negocio».
   TOTALES:  FQS total (≈24 px) y completitud total (≈26 px) en grande; ningún texto supera la píldora (26 px) salvo el nombre.
   SEMÁFORO: 2 muy favorable · 1 favorable · 0 neutro · -1 desfavorable · -2 muy desfavorable ·
             "y" amarillo = fuente no fiable / ESTIMADO propio / N/D.
   REGISTRO: REG = lista de objetos con los 14 campos del cap. 3.1 (seccion, campo, clave, estado D/P/N,
             valor numérico, unidad, periodo, fuente, fecha, confianza HIGH/MEDIUM/LOW, critico S/N,
             verificado S/N, nota, disponible_cuando). Mantén todas las filas; mínimo 60.
   ENCABEZADO: el nombre del activo (≈42 px) es el texto mayor; la píldora (≈26 px) el segundo. El encabezado NO muestra
             el precio (varía con el tiempo): el precio de referencia, su origen y su hora van solo en la sección 12.
   EXPORTAR .md: genera el dashboard COMPLETO (17 secciones, KPIs, tablas, hitos, escenarios, notas, completitud
             y registro) a partir de lo mismo que se ve en pantalla; no hay que mantenerlo aparte.
   FECHAS:   LAST_UPDATE = fecha de creación/última revisión. NEXT_UPDATE = próxima fecha de datos
             relevantes (resultados, 13F, guía…). Si NEXT_UPDATE ya pasó, las fechas se ponen en ROJO.
   ===================================================================================== */

/* ===== DATOS · constantes (sustituir) ===== */
const LAST_UPDATE="2026-10-12";      // AAAA-MM-DD · fecha de creación / última revisión
const NEXT_UPDATE="2026-10-29";                // AAAA-MM-DD · próxima fecha de datos relevantes ("" = N/D)

const EMPRESA_SLUG="apig";      // minúsculas, sin espacios ni acentos: lowes, hrl, vici…

 const d=document.getElementById("idl");if(d&&typeof matchMedia==="function"&&matchMedia("(max-width:760px)").matches)d.removeAttribute("open")}

const vv=r=>r.valor==null?(r.nota||nd):r.valor+(r.unidad&&r.unidad!=="fecha"?" "+r.unidad:"")+(r.nota?" · "+r.nota:"");

const BAN=()=>`<div class="bn"><h3>${esc(D.meta.banner.t)}</h3><p>${esc(D.meta.banner.p)}</p><div class="lg">${[["2","Muy favorable"],["1","Favorable"],["0","Neutro"],["-1","Desfavorable"],["-2","Muy desfavorable"],["y","Fuente no fiable / estimación propia / N/D"]].map(x=>`<span><i style="background:${LV[x[0]]}"></i>${x[1]}</span>`).join("")}</div></div>`;

const BK={
aviso:b=>`<div class="bn"><p>${esc(b.p)}</p></div>`,
kpis:b=>kr(b.a),
panel:b=>P(b.t,b.i,rows(b.f)),

flags:b=>`<div class="g2"><div class="pn"><h3 style="color:${LV[2]}">Green flags</h3><p>${esc(b.verde)}</p></div><div class="pn"><h3 style="color:${LV[-2]}">Red flags</h3><p>${esc(b.rojo)}</p></div></div>`,
barras:b=>P(b.t,b.i,b.c.map(k=>sb(SCL[k]||k,D.sc[k])).join("")),
calc12:()=>P("Precio de referencia","usado en las secciones 12–14 · varía con el tiempo",`<p>${num(PRICE)?esc(PRICE.toFixed(2)+cur):"N/D"} · ${esc(D.meta.precio_nota)}</p>`)+kr([["Capitalización",...cal(MC,v=>"≈"+n0(v)+"M"),0],["EV",...cal(EV,v=>"≈"+n0(v)+"M"),0],
 ["P/E aj.",...cal(ok(PRICE,C.eps_aj)&&C.eps_aj>0?PRICE/C.eps_aj:null,v=>"≈"+f1(v)+"x"),1],
 ["EV/EBITDA aj.",...cal(ok(EV,C.ebitda)&&C.ebitda>0?EV/C.ebitda:null,v=>"≈"+f1(v)+"x"),0],
 ["P/B",...cal(ok(MC,C.patrimonio)&&C.patrimonio>0?MC/C.patrimonio:null,v=>"≈"+f2(v)+"x"),1],
 ["Dividend yield",...cal(YLD,v=>"≈"+f1(v)+"%","dividendo ÷ precio"),1],
 ["P/FCF 12m",...cal(ok(MC,C.fcf_12m)&&C.fcf_12m>0?MC/C.fcf_12m:null,v=>"≈"+f1(v)+"x","FCF yield ≈"+(ok(MC,C.fcf_12m)?f1(C.fcf_12m/MC*100)+"% ESTIMADO":"N/D")),1]]),
calc13:b=>{const g=(r)=>{const v=RG(r);return v==null?nd:f1(v)+"%"};
 return P("Reverse DCF","ESTIMADO · Gordon simplificado",tbl(["Parámetro","Valor"],[["Capitalización",MC==null?nd:"≈"+n0(MC)+"M (precio × acciones diluidas)"],["FCF 12 meses",num(C.fcf_12m)?n0(C.fcf_12m)+"M (ESTIMADO: OCF − capex)":nd],["Crecimiento implícito r="+C.r1+"%",g(C.r1)],["Crecimiento implícito r="+C.r2+"%",g(C.r2)]]))+P("Conclusión","",rows([["¿Razonable?",b.conclusion,Y]]))},
calc14:b=>{const s=C.esc.map(x=>{const p=ok(x.pe,x.eps)?x.pe*x.eps:null,v=ok(p,PRICE)?(p/PRICE-1)*100:null;return[x.n,ok(x.pe)?"P/E "+f1(x.pe)+"x":nd,ok(x.eps)?f2(x.eps):nd,p==null?nd:f1(p)+cur,v==null?nd:f1(v)+"%",v==null||YLD==null?nd:f1(v+YLD)+"%"]}),base=s[1]||[];
 return P("Retorno esperado a 12 meses","objetivo anual "+C.objetivo+"% · ESTIMADO",rows([["Veredicto",base[5]&&base[5]!==nd?"Escenario base ≈"+base[5]+" (dividendo + precio) frente al objetivo del "+C.objetivo+"%; supuestos propios":nd,Y],["Tesis",nd,Y]])+tbl(["Escenario","Múltiplo","BPA supuesto","Precio","Variación","+ dividendo"],s))+P("Notas","",`<p>${esc(b.nota)}</p>`)},
fqs:()=>{const s=D.sc,w=D.fqs_pesos,q=FQS();return P("Fundamental Quality Score","0–100 · subjetivo, baja confianza",`<div class="tot t24"><span class="n">${q==null?"N/D":q}</span><span class="d">/100 · total ponderado (${esc(w.fase)})</span></div>`+sb("Financial Health",s.fin)+sb("Valuation",s.val)+sb("Moat",s.moat)+sb("Growth",s.growth)+sb("Risk (invertido)",num(s.risk)?100-s.risk:null)+`<p>Pesos (${esc(w.fase)}): Fin. ${w.fin*100}%, Riesgo ${w.risk*100}%, Valoración ${w.val*100}%, Moat ${w.moat*100}%, Growth ${w.growth*100}%, Mgmt+Capital ${w.mgcap*100}%, Business ${w.business*100}%.</p>`)},
completitud:()=>P("Completitud","",sb("Global (D + ½P)",GLOB)+sb("Alta confianza (D·HIGH)",HI)+`<p>${cnt("D")} disponibles · ${cnt("P")} parciales · ${cnt("N")} N/D · ${TOT} campos (mínimo exigido: 60). Techo alcanzable: ${D.techo==null?"N/D":D.techo+"%"}.</p>`)+P("Completitud por sección","valoración total y detalle",`<div class="tot t26"><span class="n">${GLOB}%</span><span class="d">Valoración total de completitud · D + ½P sobre ${TOT} campos · alta confianza ${HI}%</span></div>`+SECS.map(s=>{const f=REG.filter(r=>r.seccion===s);return sb(s,pc(f.filter(r=>r.estado==="D").length+.5*f.filter(r=>r.estado==="P").length,f.length))}).join("")),
checklist:()=>CKH(),
ids:()=>{const r=IDS(),lab={S:["Cumple",LV[2]],N:["No cumple",LV[-2]],ND:["N/D",LV.y],NA:["No aplica",LV[0]]};
 return P("Protocolos de Validación","% cumplido sobre los criterios aplicables · lo no verificado no suma",tbl(["Documento","% cumplido","Cumplen","No cumplen","N/D","No aplica","Estado"],r.map(x=>[x.d.n,x.pd,x.s,x.n,x.tot-x.ev,x.na,stI[x.st]])))+r.map((x,i)=>P(x.d.n,x.pd+" cumplido · evaluados "+x.ev+" de "+x.tot,tbl(["Criterio","Estado","Dato y fuente"],x.d.c.map(c=>[c[0],c[1],c[2]||nd]),[0,e=>tag((lab[e]||lab.ND)[0],(lab[e]||lab.ND)[1])]),"idd-"+i)).join("")},
bitacora:()=>P("Bitácora de rondas","completitud, puertas de control y críticos",tbl(["Ronda","Bloque","Completitud antes → después","Resueltos","Agotados","Puerta (comprob./FAIL/SKIP)","Críticos verificados"],D.bitacora.length?D.bitacora:[[nd,nd,nd,nd,nd,nd,nd]])),
agotados:()=>P("N/D agotados","≥ 3 intentos documentados por campo",tbl(["Campo","Intentos (qué se buscó y dónde)"],D.agotados.length?D.agotados:[[nd,nd]])),
criticos:()=>{const c=REG.filter(r=>r.critico==="S"),v=c.filter(r=>r.verificado==="S").length;return P("Campos críticos · doble extracción",v+" de "+c.length+" verificados",tbl(["Campo","Valor","Verificado"],c.map(r=>[r.campo,vv(r),r.verificado]),[0,0,x=>tag(x==="S"?"S":"N",x==="S"?LV[1]:LV.y)]))},
registro:()=>SECS.map(s=>P(s,"",tbl(["Campo","Estado","Valor / motivo","Fuente","Conf.","Crít./Verif.","Disponible cuándo"],REG.filter(r=>r.seccion===s).map(r=>[r.campo,r.estado,vv(r),r.fuente||nd,r.confianza,r.critico+"/"+r.verificado,r.estado==="D"?"Ya":r.disponible_cuando||"—"]),[0,c=>tag(stN[c]||c,c==="D"?LV[1]:LV.y)]))).join("")
};
const R=n=>D.S[n].map(b=>BK[b.k](b)).join("")+NT(n);

const ORD=["Checklist de evaluación preliminar","Tendencia → industrias","Negocio","Fase de crecimiento","Ventaja competitiva","Gestión","Crecimiento","Riesgos","Vendedor en corto","Trampas de valor","Rastreo institucional","Valoración","Reverse DCF","Retorno esperado","Analista en 5 pasos","Tesis de inversión","Completitud de datos"];
document.getElementById("nav").innerHTML=ORD.map((t,i)=>`<div class="ni" data-i="${i+1}" onclick="go(${i+1})">${i+1} · ${t}</div>`).join("");
function go(n){document.querySelectorAll(".ni").forEach(e=>e.classList.toggle("on",+e.dataset.i===n));document.getElementById("main").innerHTML=`<h2>${n} · ${ORD[n-1]}</h2>`+BAN()+R(n)}

document.getElementById("co").textContent=D.meta.empresa;
let LOGO_SHOWN=false;
(function(){const L=D.meta.logo||{},img=document.getElementById("logo");let src="";
 if(L.ok===true){
  if(typeof L.svg==="string"&&/^\s*<svg[\s>]/i.test(L.svg)&&L.svg.length<=120000)src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(L.svg);
  else if(typeof L.src==="string"&&/^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i.test(L.src)&&L.src.length<=250000)src=L.src}
 if(src){img.src=src;img.alt="Logo de "+D.meta.empresa;img.hidden=false;LOGO_SHOWN=true}})();
document.getElementById("sub").textContent=D.meta.ticker+" · "+D.meta.bolsa+" · "+D.meta.moneda;

/* ---- fechas: píldora de última revisión + próxima actualización de datos relevantes ----
   Píldora (≈26 px, la mayor de la página): 0–29 días verde · 30–59 ámbar · 60–89 naranja · 90+ rojo.
   Regla de datos relevantes: si NEXT_UPDATE ya ha pasado (anterior a hoy), ambas fechas pasan a ROJO.
   Si además era anterior a LAST_UPDATE, el dashboard se creó ya con esos datos superados. */
const FECHAS={ultima:"",proxima:""};
(function(){
const GRN="#8FAE8B",AMB="#CC9F53",ORG="#E08A4A",RED="#E14A4A",YEL=LV.y;
const d0=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fm=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
const dif=(a,b)=>Math.round((b-a)/864e5);
const t=new Date();t.setHours(0,0,0,0);
const l=d0(LAST_UPDATE),nx=d0(NEXT_UPDATE);
const superada=!!nx&&nx<t,alCrear=!!nx&&!!l&&nx<l;
const p=document.getElementById("fresh"),q=document.getElementById("next");
let c,b,txt;
if(!l){c=YEL;b="fecha de revisión N/D";txt="Última revisión: N/D"}
else{const n=Math.max(0,dif(l,t));
 if(n<30){c=GRN;b="dato fresco"}else if(n<60){c=AMB;b="revisar pronto"}else if(n<90){c=ORG;b="desactualizado"}else{c=RED;b="dato obsoleto"}
 if(superada){c=RED;b=alCrear?"datos relevantes ya superados al crear el dashboard":"datos relevantes superados: actualizar"}
 txt="Última revisión: "+fm(l)+" ("+(n===0?"hoy":"hace "+n+" días")+") · "+b}
p.style.color=p.style.borderColor=c;p.innerHTML=`<i style="background:${c}"></i>${txt}`;FECHAS.ultima=(c===RED?"🔴 ":"")+txt;
let c2,t2;
if(!nx){c2=YEL;t2="Próxima actualización de datos relevantes: N/D · "+NEXT_UPDATE_MOTIVO}
else{const k=dif(t,nx);
 if(superada){c2=RED}else if(k<=7){c2=ORG}else if(k<=30){c2=AMB}else{c2=GRN}
 t2="Próxima actualización de datos relevantes: "+fm(nx)+" ("+(k>0?"en "+k+" días":k===0?"hoy":"vencida hace "+(-k)+" días")+") · "+NEXT_UPDATE_MOTIVO}
q.style.color=q.style.borderColor=c2;q.innerHTML=`<i style="background:${c2}"></i>${esc(t2)}`;FECHAS.proxima=(c2===RED?"🔴 ":"")+t2;
})();


/* ---- exportación .md: dashboard completo (se convierte el mismo HTML que se ve en pantalla) ---- */
const LVR=Object.fromEntries(Object.entries(LV).map(([k,v])=>[v.toUpperCase(),k]));
const LVN={"2":"🟢 muy favorable","1":"🟢 favorable","0":"⚪ neutro","-1":"🟠 desfavorable","-2":"🔴 muy desfavorable","y":"🟡 estimado / N/D"};
const sem=a=>{const m=/#[0-9A-Fa-f]{6}/.exec(a||""),k=m?LVR[m[0].toUpperCase()]:undefined;return k===undefined?"":LVN[k]};
const tx=e=>e.textContent.replace(/\s+/g," ").trim(),mq=v=>String(v==null?"":v).replace(/\|/g,"\\|").replace(/\s+/g," ").trim();
function tab2md(t){const h=[...t.querySelectorAll("thead th")].map(tx),r=[...t.querySelectorAll("tbody tr")].map(tr=>[...tr.children].map(td=>mq(tx(td))));return"| "+h.map(mq).join(" | ")+" |\n|"+h.map(()=>"---").join("|")+"|\n"+r.map(x=>"| "+x.join(" | ")+" |").join("\n")}
function pn2md(el,lv,plain){const h=el.querySelector("h3"),i=h.querySelector("i"),inf=i?tx(i):"";if(i)i.remove();
 const o=["#".repeat(lv)+" "+tx(h)+(inf?" · _"+inf+"_":"")];let cur=[];const fl=()=>{if(cur.length){o.push(cur.join("\n"));cur=[]}};
 for(const c of el.children){if(c===h)continue;
  if(c.classList.contains("sr")){const s=plain?"":sem(c.getAttribute("style"));cur.push("- "+(s?s+" · ":"")+"**"+tx(c.querySelector("b"))+"** — "+tx(c.querySelector("span")))}
  else if(c.classList.contains("sb")){const sp=c.querySelectorAll(".t span");cur.push("- "+tx(sp[0])+": "+tx(sp[1]))}
  else{fl();o.push(c.tagName==="TABLE"?tab2md(c):tx(c))}}
 fl();return o.join("\n\n")}
function sec2md(n){const d=document.createElement("div");d.innerHTML=R(n);const o=["## "+n+" · "+ORD[n-1]];
 for(const el of d.children){
  if(el.classList.contains("kr"))o.push("| Indicador | Valor | Nota |\n|---|---|---|\n"+[...el.children].map(k=>{const v=k.querySelector(".v");return"| "+mq(tx(k.querySelector(".l")))+" | "+mq(tx(v))+" "+sem(v.getAttribute("style")).split(" ")[0]+" | "+mq(tx(k.querySelector(".s")))+" |"}).join("\n"));
  else if(el.classList.contains("bn"))o.push("> "+tx(el));
  else if(el.classList.contains("g2"))el.querySelectorAll(".pn").forEach(x=>o.push(pn2md(x,3)));
  else if(el.classList.contains("nt"))o.push("### Notas de aclaración\n\n"+[...el.querySelectorAll(".nt-i")].map(i=>{const dt=i.querySelector("dt"),em=dt.querySelector("em"),neg=!!em;if(em)em.remove();return"- **"+tx(dt)+"**"+(neg?" _(del negocio)_":"")+" — "+tx(i.querySelector("dd"))}).join("\n"));
  else if(el.classList.contains("pn"))o.push(pn2md(el,3))}
 return o.join("\n\n")}
const idsMD=()=>{const r=IDS(),ic={ok:"✅",no:"❌",nd:"🟡",na:"⚪"};return"## Protocolos de Validación\n\n| Documento | % cumplido | Cumplen / criterios | Evaluados | Estado |\n|---|---|---|---|---|\n"+r.map(x=>"| "+mq(x.d.n)+" | "+x.pd+" | "+x.s+" / "+x.tot+" | "+x.ev+" / "+x.tot+" | "+ic[x.st]+" |").join("\n")+"\n\nRegla: ✅ más del 75 %; ❌ 25 % o menos con al menos "+Math.round(COB_MIN*100)+" % de criterios evaluados; 🟡 indeterminado; ⚪ no aplica. Lo no verificado no suma.\n"};
function buildMD(){const m=D.meta;
 return["# "+m.empresa+" ("+m.ticker+") — Dashboard de análisis fundamental",
 "- **Bolsa · moneda:** "+m.bolsa+" · "+m.moneda+(LOGO_SHOWN?"\n- **Logo:** verificado · "+(m.logo.fuente||nd):"")+"\n- "+FECHAS.ultima+"\n- "+FECHAS.proxima,
 "> "+m.fuente_principal+" "+m.construccion,
 idsMD(),
 "## Contexto del precio\n\n"+D.meta.banner.p+"\n\nSemáforo: 🟢 favorable · ⚪ neutro · 🟠 desfavorable · 🔴 muy desfavorable · 🟡 fuente no fiable / estimación propia / N/D",
 ...ORD.map((_,i)=>sec2md(i+1)),"_No es recomendación de compra o venta._"].join("\n\n")+"\n"}

/* ---- exportaciones ---- */
function dl(x,n,m){const u=URL.createObjectURL(new Blob([x],{type:m})),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
const COLS=["seccion","campo","clave","estado","valor","unidad","periodo","fuente","fecha","confianza","critico","verificado","nota","disponible_cuando"];
const qq=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
const csv=rs=>"\uFEFF"+[COLS.join(",")].concat(rs.map(r=>COLS.map(c=>qq(r[c])).join(","))).join("\r\n");

function exFuentes(){dl("\uFEFF"+["seccion,campo,fuente,fecha,confianza"].concat(REG.filter(r=>r.estado!=="N").map(r=>[r.seccion,r.campo,r.fuente,r.fecha,r.confianza].map(qq).join(","))).join("\r\n"),EMPRESA_SLUG+"-fuentes.csv","text/csv;charset=utf-8")}
function exIDs(){const r=IDS(),rows=[["documento","pct_cumplido","criterio","estado","nota"]];r.forEach(x=>x.d.c.forEach(c=>rows.push([x.d.n,x.pct==null?"":x.pct,c[0],c[1],c[2]||""])));dl("\uFEFF"+rows.map(a=>a.map(qq).join(",")).join("\r\n"),EMPRESA_SLUG+"-protocolos.csv","text/csv;charset=utf-8")}
function exInst(){dl(csv(REG.filter(r=>r.seccion==="Institucional")),EMPRESA_SLUG+"-institucional.csv","text/csv;charset=utf-8")}
renderIDL();
go(1);
